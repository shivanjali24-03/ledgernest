name: Feature
description: Propose a new feature or improvement
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and why?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
