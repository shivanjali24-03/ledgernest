<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LedgerNest</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --ink: #252a36; --muted: #667591; --brand: #067e74; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f121a; --ink: #eceef2; --muted: #8593ab; --brand: #53f5dc; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
      main { max-width: 28rem; text-align: center; }
      a { color: var(--brand); font-weight: 600; }
      p { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>LedgerNest</h1>
      <p>This environment hasn't had its first release yet.</p>
      <p><a href="/ledgernest/dev/">Open the development version</a></p>
    </main>
  </body>
</html>
